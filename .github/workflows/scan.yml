name: NSE scan

# Runs entirely on GitHub's servers - no computer of yours needs to be on.
#
# GitHub cron is always UTC; IST = UTC + 5:30. Monday-Friday only.
#
#   1H candles close at 10:15 11:15 12:15 13:15 14:15 15:15 and 15:30 IST (the last one is 15 minutes
#   long), so there are SEVEN hourly scans a day, each a few minutes after its candle closes.
#   The daily candle is final at 15:45 IST, so there is ONE daily scan a day. That run also refreshes
#   prices and enrichment (sector / market cap / indices).
#
# The scanner decides what is actually due (schedule.py), so a delayed or repeated run is harmless.
on:
  schedule:
    - cron: "50 4-9 * * 1-5"   # 10:20 11:20 12:20 13:20 14:20 15:20 IST -> hourly scans 1-6
    - cron: "5 10 * * 1-5"     # 15:35 IST                               -> hourly scan 7 (15:15-15:30 candle)
    - cron: "20 10 * * 1-5"    # 15:50 IST                               -> the daily scan + prices + enrich
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps, space separated (universe scan prices enrich board validate)"
        default: "scan prices enrich board"
      force:
        description: "Rescan every symbol now, ignoring the schedule"
        type: boolean
        default: false

permissions:
  contents: write   # lets the workflow commit the updated data back

# One run at a time: a second run waits instead of fighting over stocks.json.
concurrency:
  group: nse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the very first run (whole universe + enrichment) is the long one

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history is needed so the trim step can count commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Sync (only what is due)
        id: sync
        timeout-minutes: 110
        continue-on-error: true   # partial results are checkpointed; validate and commit them anyway
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            if [ "${{ github.event.schedule }}" = "20 10 * * 1-5" ]; then
              STEPS="scan prices enrich board"     # the daily run
            else
              STEPS="scan board"                   # the seven hourly runs
            fi
          fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          echo "steps: $STEPS $FORCE"
          python master_sync_all.py --steps $STEPS --workers 4 $FORCE
          # --workers 4 is gentler on Yahoo's rate limits, which matters more from GitHub's shared IPs.

      - name: Validate (nothing broken is ever published)
        env:
          PYTHONUTF8: "1"
        run: python validate_data.py

      - name: Commit the updated data back to the repository
        run: |
          git config user.name  "nse-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A shared-data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Automated scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "Could not push after 3 attempts"
          exit 1

      - name: Keep only the newest 100 commits (rolling history)
        env:
          KEEP: "100"
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          TOTAL=$(git rev-list --count HEAD)
          echo "commits on branch: $TOTAL (keeping $KEEP)"
          if [ "$TOTAL" -le "$KEEP" ]; then echo "nothing to trim"; exit 0; fi
          # The KEEP-th newest commit becomes the new first commit (same files, no parent).
          OLDEST=$(git rev-list HEAD | sed -n "${KEEP}p")
          ROOT=$(git commit-tree "${OLDEST}^{tree}" -m "history trimmed - snapshot of: $(git log -1 --format=%s "$OLDEST")")
          git rebase --onto "$ROOT" "$OLDEST" HEAD
          # --force-with-lease refuses to overwrite if someone pushed in the meantime
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload logs (kept for 7 days, for troubleshooting only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark the run red if the sync step itself failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "The sync step failed or timed out (partial results were validated and committed)."
          exit 1

  # Publishes the website from the newest commit. Pushes made by the bot do not start other workflows, so this
  # workflow publishes the site itself (needs Settings -> Pages -> Source = "GitHub Actions").
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # the branch tip as it is NOW, including the commit the scan just pushed
      - name: Collect the website files
        run: |
          mkdir _site
          cp -r index.html assets main-dashboard stock signals shared-data .nojekyll _site/ 2>/dev/null || true
          find _site -maxdepth 2 | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
